name: CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]


jobs:
  build:
    runs-on: ubuntu-26.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'oracle'
        cache: maven
    
    - name: Build and test with Maven
      run: mvn verify
