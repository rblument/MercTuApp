# Test database configuration for integration tests (see BaseIT).
#
# These values mirror src/main/java/resources/Merc.properties and exist so
# ResourceMgr has a complete properties file on the integration test
# classpath. BaseIT points MySqlDAO at the Testcontainers MySQL instance
# directly, so DB_HOST/DB_PORT are not used to locate the test database.

# Assigns the language displayed in the UI
language=en

# Assigns the locale language variant displayed in the UI
country=us

# The computer host on which the MySQL database executes (default: localhost).
edu.regis.merc.DB_HOST=localhost

# The computer port on which the MySQL database executes (default: 3306)
edu.regis.merc.DB_PORT=3306

# The name of the MercTu database (default: MercTuDB).
edu.regis.merc.DB_NAME=MercTuDB

# The user id MercTu uses to log into the database (default: MercTuTs).
edu.regis.merc.DB_USER=MercTuTs

# The password MercTu uses to login to the database.
edu.regis.merc.DB_PASS=MercTu2025
