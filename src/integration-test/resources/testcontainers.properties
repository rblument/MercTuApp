# Enable Testcontainers container reuse for integration tests.
#
# The first run starts the MySQL container and leaves it running; later runs
# attach to it instead of starting a new one, so startup goes from tens of
# seconds to under a second. Changing the init scripts (or any other container
# configuration) invalidates the reuse hash and triggers a fresh container.
#
# Reused containers linger after the JVM exits. To remove them:
#   docker rm -f $(docker ps -aq --filter "label=org.testcontainers")

testcontainers.reuse.enable=true
